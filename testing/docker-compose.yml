services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-fortuna-backend:local}
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      REDIS_DNS: redis
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9000/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    image: ${FRONTEND_IMAGE:-fortuna-frontend:local}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_DNS: backend
      BACKEND_PORT: "9000"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"