apiVersion: apps/v1
kind: Deployment
metadata:
  name: cookie-serve-frontend
  namespace: student-12
  labels:
    app: cookie-serve-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cookie-serve-frontend
  template:
    metadata:
      labels:
        app: cookie-serve-frontend
    spec:
      containers:
        - name: cookie-serve-frontend
          image: lilybw/sdu-s10-cicd-fortuna:frontend-latest
          env:
            - name: BACKEND_DNS
              value: cookie-serve-backend
            - name: BACKEND_PORT
              value: "9000"
          ports:
            - containerPort: 8080