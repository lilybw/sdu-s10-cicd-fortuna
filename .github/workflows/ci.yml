name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    uses: ./.github/workflows/components.unit-testing.yml

  build:
    uses: ./.github/workflows/components.build.yml

  test-environment:
    needs: [unit-tests, build]
    uses: ./.github/workflows/components.testing-environment.yml
    with:
      backend-image: ${{ needs.build.outputs.backend-image }}
      frontend-image: ${{ needs.build.outputs.frontend-image }}
      backend-artifact: ${{ needs.build.outputs.backend-artifact }}
      frontend-artifact: ${{ needs.build.outputs.frontend-artifact }}

  release:
    needs: [build, test-environment]
    uses: ./.github/workflows/components.release.yml
    with:
      backend-artifact: ${{ needs.build.outputs.backend-artifact }}
      frontend-artifact: ${{ needs.build.outputs.frontend-artifact }}

  publish:
    needs: [build, test-environment]
    uses: ./.github/workflows/components.publish-dockerhub.yml
    with:
      dockerhub-username: lilybw
      backend-artifact:  image-backend-ci-${{ github.sha }}
      frontend-artifact: image-frontend-ci-${{ github.sha }}
      version:           ${{ github.event.release.tag_name }}
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
