name: Test Environment

on:
  workflow_call:
    inputs:
      compose-path:
        type: string
        required: false
        default: testing
      frontend-url:
        type: string
        required: false
        default: http://localhost:8080
      backend-image:
        description: "Prebuilt backend image ref to run"
        type: string
        required: true
      frontend-image:
        description: "Prebuilt frontend image ref to run"
        type: string
        required: true
      backend-artifact:
        description: "Artifact name holding the backend image tarball"
        type: string
        required: true
      frontend-artifact:
        description: "Artifact name holding the frontend image tarball"
        type: string
        required: true

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: ${{ inputs.backend-image }}
      FRONTEND_IMAGE: ${{ inputs.frontend-image }}
    steps:
      - uses: actions/checkout@v4

      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.backend-artifact }}

      - name: Download frontend image
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.frontend-artifact }}

      - name: Load images
        run: |
          docker load -i backend-image.tar
          docker load -i frontend-image.tar

      - name: Start the stack
        working-directory: ${{ inputs.compose-path }}
        run: docker compose up -d   # no --build; images are preloaded

      - name: Wait for frontend health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS ${{ inputs.frontend-url }}/healthz | grep -q healthy; then
              echo "frontend is healthy"; exit 0
            fi
            echo "waiting for frontend... ($i)"; sleep 2
          done
          echo "frontend never became healthy"; exit 1

      - name: Smoke test - random fortune
        run: |
          body=$(curl -fsS ${{ inputs.frontend-url }}/api/random)
          echo "random -> $body"
          test -n "$body"

      - name: Smoke test - list all fortunes
        run: |
          curl -fsS ${{ inputs.frontend-url }}/api/all | grep -q "fortune" \
            || (echo "no fortunes rendered"; exit 1)

      - name: Smoke test - add a fortune
        run: |
          curl -fsS -X POST ${{ inputs.frontend-url }}/api/add \
            -H 'Content-type: application/json' \
            -d '{"message":"CI was here"}' | grep -q "Cookie added"

      - name: Verify added fortune persisted
        run: |
          curl -fsS ${{ inputs.frontend-url }}/api/all | grep -q "CI was here" \
            || (echo "added fortune not found"; exit 1)

      - name: Dump logs on failure
        if: failure()
        working-directory: ${{ inputs.compose-path }}
        run: docker compose logs

      - name: Tear down
        if: always()
        working-directory: ${{ inputs.compose-path }}
        run: docker compose down -v